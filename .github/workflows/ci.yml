name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: .venv/bin/python -m pytest -v --cov=app --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: vector-hub-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: vector-hub-frontend:ci

  compose-integration:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 20
    env:
      OIDC_CLIENT_SECRET: changeme
      SECRET_KEY: isolated-ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser acceptance tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build and wait for the actual Compose stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify real OIDC login and browser project creation
        run: python scripts/verify_browser.py create
      - name: Restart backend and require readiness
        run: |
          docker compose restart backend
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not recover after restart" >&2
          exit 1
      - name: Sign in again and verify project persistence
        run: python scripts/verify_browser.py verify
      - name: Report service state
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100
          for service in frontend backend keycloak; do
            container_id=$(docker compose ps --all --quiet "$service")
            if [ -n "$container_id" ]; then
              docker inspect --format '{{json .State.Health}}' "$container_id"
            fi
          done
      - name: Shutdown isolated stack
        if: always()
        run: docker compose down -v
