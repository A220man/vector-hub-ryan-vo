name = "vector-hub-ryan-vo"
version = "1.0.2"
authors = [{name = "Ryan Vo", email = "ryandtvo@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.0",
    "sqlalchemy==2.0.36",
    "pydantic-settings==2.6.1",
    "python-jose==3.3.0",
    "httpx==0.28.0",
    "ulid-py==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==5.0.0",
    "python-multipart==0.0.9",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"